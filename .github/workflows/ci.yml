name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Only the API and its tests. The MAUI client needs platform workloads.
      - name: Test
        run: dotnet test LMS/CLI.LMS.Api.Tests/CLI.LMS.Api.Tests.csproj
